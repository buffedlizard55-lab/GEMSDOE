name: Re-blend existing fold artifacts -> submission

# =============================================================================
# WHY THIS WORKFLOW EXISTS
#
# Actions run 35042805806 trained all six ensemble folds successfully (2 h 36 min)
# and then died in the blend job at the very last step:
#
#   rasterio._err.CPLE_AppDefinedError: _TIFFVSetField:submission.tif:
#       Bad value 3292 for "TileWidth" tag
#   RasterioBlockError: The height and width of TIFF dataset blocks must be
#       multiples of 16
#
# Cause: the writer copied the sample submission's rasterio profile (a STRIPED
# GeoTIFF, thus blockxsize == width == 3292) and then forced TILED=YES.
# The crash was invisible because the step piped into `tee` without `pipefail`,
# so the job went green, and a 110-byte GDAL stub was committed to the branch as
# `data/evidence/runs/35042805806/submission.tif`.
#
# The trained fold artifacts (6 x ~120 MB: prob_raw.tif + heldout_mc*.npz +
# manifest + checkpoints) are still live for 14 days.  This workflow re-runs ONLY
# the blend step against them with the corrected writer, so a real submission.tif
# exists in minutes instead of re-training for hours.
#
# Gate: src/submission_io.write_submission reads the written bytes back and raises
# unless the file is a single-band float32 raster on the requested grid with
# non-zero mass.  `set -euo pipefail` on every step means a crash can no longer
# masquerade as success.
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run whose fold-* artifacts to reuse"
        default: "35042805806"
      weights:
        description: "fold averaging: equal | dti"
        type: choice
        options: [equal, dti]
        default: equal
      shaping_grid:
        description: "number of log-spaced (t0, thin) candidates"
        default: "15"
  push:
    branches: ["arena/**"]
    paths: [".github/triggers/reblend"]

permissions:
  contents: write
  actions: read

concurrency:
  group: reblend-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  blend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (fixed blend code)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (numpy/scipy/rasterio/scikit-image - the blend needs no torch)
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy scipy rasterio scikit-image pyyaml

      - name: Download fold artifacts from run ${{ github.event.inputs.run_id || '35042805806' }}
        uses: actions/download-artifact@v4
        with:
          pattern: fold-*
          path: folds
          run-id: ${{ github.event.inputs.run_id || '35042805806' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Fold inventory
        run: |
          set -euo pipefail
          for d in folds/fold-*/; do
            echo "== $d"; ls -la "$d"
          done

      - name: Download labels + sample grid (data-tab Dropbox mirrors)
        run: |
          set -euo pipefail
          mkdir -p data
          dl () { curl -fL --retry 3 --retry-delay 5 -o "data/$2" "$1"; echo "OK $2 $(stat -c%s "data/$2") bytes"; }
          dl "https://www.dropbox.com/scl/fi/t7fyt03qdh9egyme0itwo/existing_faults.tif?rlkey=yiao96uluqdkipf0h5vju71jf&dl=1" labels.tif
          dl "https://www.dropbox.com/scl/fi/6rgvnuady818ol8yqgis4/example_submission.tif?rlkey=kbykilvau066xuogoosbf4cq8&dl=1" sample_submission.tif
          dl "https://www.dropbox.com/scl/fi/3vz9o0wwavi26xaeoxlwr/gems-geodawn-numerical-features.tif?rlkey=je8d8fepqfbst9lnwsq9rkplu&dl=1" training_features.tif
          sha256sum data/*.tif | tee data/checksums.txt

      - name: Blend + shape + write submission (fail-loud)
        run: |
          set -euo pipefail
          python scripts/blend_submission.py \
            --folds folds/fold-*/ \
            --config configs/config_ci_ensemble.yaml \
            --sample data/sample_submission.tif \
            --labels data/labels.tif \
            --out submission.tif --report blend_report.json \
            --weights "${{ github.event.inputs.weights || 'equal' }}" \
            --shaping-grid "${{ github.event.inputs.shaping_grid || '15' }}" 2>&1 | tee blend.log

      - name: Validate submission format (exit code gates the commit)
        run: |
          set -euo pipefail
          python scripts/validate_submission.py --pred submission.tif \
            --sample data/sample_submission.tif --train data/training_features.tif 2>&1 | tee validation.log

      - name: Post-write audit (reads the submission bytes back; prints sha256)
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee postwrite.log
          import json, numpy as np, rasterio
          from pathlib import Path
          p = Path("submission.tif")
          with rasterio.open(p) as src:
              a = src.read(1)
              info = dict(path=str(p), bytes=p.stat().st_size, width=src.width, height=src.height,
                          count=src.count, dtype=src.dtypes[0], crs=str(src.crs),
                          res=[float(r) for r in src.res], nodata=src.nodata,
                          tiled=bool(src.profile.get("tiled")),
                          block_shapes=[list(b) for b in (src.block_shapes or [])],
                          finite_px=int(np.isfinite(a).sum()), nonzero_px=int(np.count_nonzero(np.nan_to_num(a))),
                          prob_mass=float(np.nansum(a)), min=float(np.nanmin(a)), max=float(np.nanmax(a)))
          assert info["count"] == 1 and info["dtype"] == "float32"
          assert info["bytes"] > 10000, f"suspiciously small submission: {info['bytes']} bytes"
          assert info["nonzero_px"] > 0, "all-zero submission"
          assert all(b % 16 == 0 for blk in info["block_shapes"] for b in blk), info["block_shapes"]
          Path("postwrite.json").write_text(json.dumps(info, indent=1))
          print(json.dumps(info, indent=1))
          PY

      - name: Commit submission + report back to the branch
        if: always()
        run: |
          set -euo pipefail
          D="data/evidence/runs/${{ github.event.inputs.run_id || '35042805806' }}"
          mkdir -p "$D"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The 110-byte stub committed by the failed run is not a submission; drop it from
          # git and keep every log next to the real artifact instead.
          git rm --cached -q --ignore-unmatch "$D/submission.tif" || true
          for f in blend.log validation.log postwrite.log postwrite.json blend_report.json submission.tif; do
            [ -f "$f" ] && cp -f "$f" "$D/" || true
          done
          [ -f "$D/submission.tif" ] && { echo "committing $(stat -c%s "$D/submission.tif") bytes"; sha256sum "$D/submission.tif" | tee "$D/submission.sha256"; }
          git add -f "$D" || true
          git diff --cached --quiet && echo "nothing to commit" || {
            git commit -m "blend(fix): rebuild submission from run ${{ github.event.inputs.run_id || '35042805806' }} fold artifacts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Upload submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-reblend-${{ github.run_id }}
          path: |
            submission.tif
            blend_report.json
            blend.log
            validation.log
            postwrite.json
          retention-days: 30
