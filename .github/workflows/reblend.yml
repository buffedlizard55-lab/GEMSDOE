name: Re-blend existing fold artifacts -> submission

# =============================================================================
# WHY THIS WORKFLOW EXISTS
#
# Actions run 35042805806 trained all six ensemble folds successfully (2 h 36 min)
# and then died in the blend job at the very last step:
#
#   rasterio._err.CPLE_AppDefinedError: _TIFFVSetField:submission.tif:
#       Bad value 3292 for "TileWidth" tag
#   RasterioBlockError: The height and width of TIFF dataset blocks must be
#       multiples of 16
#
# Cause: the writer copied the sample submission's rasterio profile (a STRIPED
# GeoTIFF, thus blockxsize == width == 3292) and then forced TILED=YES.
# The crash was invisible because the step piped into `tee` without `pipefail`,
# so the job went green, and a 110-byte GDAL stub was committed to the branch as
# `data/evidence/runs/35042805806/submission.tif`.
#
# The trained fold artifacts (6 x ~120 MB: prob_raw.tif + heldout_mc*.npz +
# manifest + checkpoints) are still live for 14 days.  This workflow re-runs ONLY
# the blend step against them with the corrected writer, so a real submission.tif
# exists in minutes instead of re-training for hours.
#
# Gate: src/submission_io.write_submission reads the written bytes back and raises
# unless the file is a single-band float32 raster on the requested grid with
# non-zero mass.  `set -euo pipefail` on every step means a crash can no longer
# masquerade as success.
#
# SECOND USE (2026-09-17, session 10): the same workflow is the recovery path for a run whose
# fold MATRIX was not entirely successful.  Run 35249562910 uploaded five complete fold
# artifacts (fold 4 crashed in training) and the ensemble workflow's own blend job is defined at
# the triggering commit, so it cannot be relaxed while the run is in flight.  The bot token cannot
# call workflow_dispatch, so the parameters are read from a committed file - exactly the pattern
# .github/workflows/train-ensemble.yml uses:
#
#   .github/triggers/reblend-params may set
#     RUN_ID=<actions run id>       (default 35042805806)
#     EVIDENCE_DIR=<path>           (default data/evidence/runs/<RUN_ID>-experiment)
#     DILATE_GRID=0,1,2,3,...       (default 0,1,2,3,4,6)
#     MIN_DILATE=<int>              (default 0 = pure skeleton)
#     MIN_FOLDS=<int>               (default 4)
#     CALIBRATE=pooled|loo
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run whose fold-* artifacts to reuse"
        default: "35042805806"
      weights:
        description: "fold averaging: equal | dti"
        type: choice
        options: [equal, dti]
        default: equal
      shaping_grid:
        description: "number of log-spaced (t0, thin) candidates"
        default: "15"
      dilate_grid:
        description: "emission width candidates in px (0 = pure skeleton, the pre-2026-09-16 behaviour)"
        default: "0,1,2,3,4,6"
      calibrate:
        description: "pooled | loo  (loo adds the leave-one-fold-out audit; slower)"
        type: choice
        options: [pooled, loo]
        default: pooled
      loo_grid:
        description: "thresholds per fold for the leave-one-fold-out audit"
        default: "7"
      evidence_dir:
        description: "where to commit the evidence (empty -> an experiment dir next to the original)"
        default: "data/evidence/runs/35042805806-dilate-ab"
  push:
    branches: ["arena/**"]
    paths: [".github/triggers/reblend"]

permissions:
  contents: write
  actions: read

concurrency:
  group: reblend-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  params:
    name: read the committed re-blend parameters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      evidence_dir: ${{ steps.p.outputs.evidence_dir }}
      dilate_grid: ${{ steps.p.outputs.dilate_grid }}
      min_dilate: ${{ steps.p.outputs.min_dilate }}
      min_folds: ${{ steps.p.outputs.min_folds }}
      calibrate: ${{ steps.p.outputs.calibrate }}
      weights: ${{ steps.p.outputs.weights }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        name: parameters (run id, evidence dir, grids)
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.inputs.run_id || '35042805806' }}"
          ED="${{ github.event.inputs.evidence_dir || '' }}"
          DIL="${{ github.event.inputs.dilate_grid || '0,1,2,3,4,6' }}"
          MINF="${{ github.event.inputs.min_folds || '4' }}"
          CAL="${{ github.event.inputs.calibrate || 'loo' }}"
          W="${{ github.event.inputs.weights || 'equal' }}"
          MIND="0"
          F=".github/triggers/reblend-params"
          if [ -f "$F" ]; then
            echo "parameters from $F:"; tr -d '\r' < "$F" | grep -E '^[A-Z_]+=' || true
            v () { tr -d '\r' < "$F" | sed -n "s/^$1=\(.*\)\$/\1/p" | tail -1 || true; }
            [ -n "$(v RUN_ID)" ] && RUN_ID="$(v RUN_ID)" || true
            [ -n "$(v EVIDENCE_DIR)" ] && ED="$(v EVIDENCE_DIR)" || true
            [ -n "$(v DILATE_GRID)" ] && DIL="$(v DILATE_GRID)" || true
            [ -n "$(v MIN_DILATE)" ] && MIND="$(v MIN_DILATE)" || true
            [ -n "$(v MIN_FOLDS)" ] && MINF="$(v MIN_FOLDS)" || true
            [ -n "$(v CALIBRATE)" ] && CAL="$(v CALIBRATE)" || true
          fi
          [ -n "$ED" ] || ED="data/evidence/runs/$RUN_ID-experiment"
          {
            echo "run_id=$RUN_ID"
            echo "evidence_dir=$ED"
            echo "dilate_grid=$DIL"
            echo "min_dilate=$MIND"
            echo "min_folds=$MINF"
            echo "calibrate=$CAL"
            echo "weights=$W"
          } >> "$GITHUB_OUTPUT"
          echo "RUN_ID=$RUN_ID ED=$ED DIL=$DIL MIN_DILATE=$MIND MIN_FOLDS=$MINF CAL=$CAL W=$W"

  blend:
    runs-on: ubuntu-latest
    needs: params
    timeout-minutes: 120
    steps:
      - name: Checkout (fixed blend code)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (numpy/scipy/rasterio/scikit-image - the blend needs no torch)
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy scipy rasterio scikit-image pyyaml

      - name: Download fold artifacts from run ${{ needs.params.outputs.run_id }}
        uses: actions/download-artifact@v4
        with:
          pattern: fold-*
          path: folds
          run-id: ${{ needs.params.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Fold inventory + minimum-fold gate
        run: |
          # Same contract as the ensemble workflow's gate: count only directories that carry BOTH a
          # probability raster and a held-out calibration crop, refuse below MIN_FOLDS, and record
          # any shortfall loudly (a partial ensemble is legitimate; a silent one is not).
          set -euo pipefail
          shopt -s nullglob
          n=0
          : > usable_folds.txt
          for d in folds/fold-*/; do
            echo "== $d"; ls -la "$d"
            if [ -f "$d/prob_raw.tif" ] && compgen -G "$d/heldout_mc*.npz" > /dev/null; then
              n=$((n + 1))
              echo "$d" | sed 's:/$::' >> usable_folds.txt
            fi
          done
          echo "usable folds: $n (MIN_FOLDS=${{ needs.params.outputs.min_folds }})"
          if [ "$n" -lt "${{ needs.params.outputs.min_folds }}" ]; then
            echo "::error::only $n usable fold artifact(s) in run ${{ needs.params.outputs.run_id }} - refusing to blend"
            exit 1
          fi
          if [ "$n" -lt 6 ]; then
            echo "::warning::blending $n of 6 folds - the shortfall is recorded in the report"
          fi

      - name: Download labels + sample grid (data-tab Dropbox mirrors)
        run: |
          set -euo pipefail
          mkdir -p data
          dl () { curl -fL --retry 3 --retry-delay 5 -o "data/$2" "$1"; echo "OK $2 $(stat -c%s "data/$2") bytes"; }
          dl "https://www.dropbox.com/scl/fi/t7fyt03qdh9egyme0itwo/existing_faults.tif?rlkey=yiao96uluqdkipf0h5vju71jf&dl=1" labels.tif
          dl "https://www.dropbox.com/scl/fi/6rgvnuady818ol8yqgis4/example_submission.tif?rlkey=kbykilvau066xuogoosbf4cq8&dl=1" sample_submission.tif
          dl "https://www.dropbox.com/scl/fi/3vz9o0wwavi26xaeoxlwr/gems-geodawn-numerical-features.tif?rlkey=je8d8fepqfbst9lnwsq9rkplu&dl=1" training_features.tif
          sha256sum data/*.tif | tee data/checksums.txt

      - name: Blend + shape + write submission (fail-loud)
        run: |
          set -euo pipefail
          python scripts/blend_submission.py \
            --folds $(cat usable_folds.txt) \
            --config configs/config_ci_ensemble.yaml \
            --sample data/sample_submission.tif \
            --labels data/labels.tif \
            --out submission.tif --report blend_report.json \
            --weights "${{ github.event.inputs.weights || 'equal' }}" \
            --shaping-grid "${{ github.event.inputs.shaping_grid || '15' }}" \
            --dilate-grid "${{ needs.params.outputs.dilate_grid }}" \
            --min-dilate "${{ needs.params.outputs.min_dilate }}" \
            --calibrate "${{ needs.params.outputs.calibrate }}" \
            --loo-grid "${{ github.event.inputs.loo_grid || '7' }}" 2>&1 | tee blend.log

      - name: Validate submission format (exit code gates the commit)
        run: |
          set -euo pipefail
          python scripts/validate_submission.py --pred submission.tif \
            --sample data/sample_submission.tif --train data/training_features.tif 2>&1 | tee validation.log

      - name: Post-write audit (reads the submission bytes back; prints sha256)
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee postwrite.log
          import json, numpy as np, rasterio
          from pathlib import Path
          p = Path("submission.tif")
          with rasterio.open(p) as src:
              a = src.read(1)
              info = dict(path=str(p), bytes=p.stat().st_size, width=src.width, height=src.height,
                          count=src.count, dtype=src.dtypes[0], crs=str(src.crs),
                          res=[float(r) for r in src.res], nodata=src.nodata,
                          tiled=bool(src.profile.get("tiled")),
                          block_shapes=[list(b) for b in (src.block_shapes or [])],
                          finite_px=int(np.isfinite(a).sum()), nonzero_px=int(np.count_nonzero(np.nan_to_num(a))),
                          prob_mass=float(np.nansum(a)), min=float(np.nanmin(a)), max=float(np.nanmax(a)))
          assert info["count"] == 1 and info["dtype"] == "float32"
          assert info["bytes"] > 10000, f"suspiciously small submission: {info['bytes']} bytes"
          assert info["nonzero_px"] > 0, "all-zero submission"
          assert all(b % 16 == 0 for blk in info["block_shapes"] for b in blk), info["block_shapes"]
          Path("postwrite.json").write_text(json.dumps(info, indent=1))
          print(json.dumps(info, indent=1))
          PY

      - name: Commit submission + report back to the branch
        if: always()
        run: |
          set -euo pipefail
          # a push-triggered run must not overwrite the original submission's evidence dir
          D="${{ needs.params.outputs.evidence_dir }}"
          mkdir -p "$D"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The 110-byte stub committed by the failed run is not a submission; drop it from
          # git and keep every log next to the real artifact instead.
          git rm --cached -q --ignore-unmatch "$D/submission.tif" || true
          for f in blend.log validation.log postwrite.log postwrite.json blend_report.json submission.tif; do
            [ -f "$f" ] && cp -f "$f" "$D/" || true
          done
          [ -f "$D/submission.tif" ] && { echo "committing $(stat -c%s "$D/submission.tif") bytes"; sha256sum "$D/submission.tif" | tee "$D/submission.sha256"; }
          git add -f "$D" || true
          git diff --cached --quiet && echo "nothing to commit" || {
            cp -f usable_folds.txt "$D/" 2>/dev/null || true
            git add -f "$D" || true
            git commit -m "blend: rebuild submission from run ${{ needs.params.outputs.run_id }} fold artifacts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Upload submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-reblend-${{ github.run_id }}
          path: |
            submission.tif
            blend_report.json
            blend.log
            validation.log
            postwrite.json
          retention-days: 30
