name: Train MC ensemble (parallel folds) + blend

# =============================================================================
# The competitive run that fits free CPU runners.  6 Monte-Carlo folds train in
# PARALLEL (one model per fold: UNet++/DeepLabV3+/U-Net x resnet34 rotating across
# folds; configs/config_ci_ensemble.yaml), each producing a full-raster raw
# probability map (8-way TTA) plus its held-out calibration crop.  A final blend
# job averages the six maps, runs ONE shaping pass calibrated on the POOLED
# held-out DTI (docs/METRIC_STRATEGY.md), validates the format, scores the result
# against the public known-fault raster for monitoring, commits everything back
# to this branch (small files + report) and uploads submission.tif + models as an
# artifact.
#
# Data path: the dev sandbox cannot reach Dropbox; runners can.  Same trick as
# .github/workflows/train-and-submit.yml (fetch from the data-tab mirrors into
# the runner's workspace).  Checkpoints stay in the artifact (14 d) - never in git.
#
# Timings are budgeted against measured CPU-runner rates (see the config comments);
# training is time-guarded (training.max_minutes) so a job CANNOT expire without a
# checkpoint.  On a GPU box use configs/config.yaml instead.
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      folds:
        description: "JSON list of fold indices to run"
        default: "[0,1,2,3,4,5]"
  push:
    branches: ["arena/**"]
    paths: [".github/triggers/ensemble"]

permissions:
  contents: write

concurrency:
  group: ensemble-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  fold:
    name: fold ${{ matrix.fold }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        fold: ${{ fromJson(github.event.inputs.folds || '[0,1,2,3,4,5]') }}
    # Second-ensemble support (2026-09-17): the bot token cannot workflow_dispatch, so runs are
    # parameterised by a COMMITTED file instead. .github/triggers/ensemble-params may set
    #   FOLD_OFFSET=<int>   added to matrix.fold to give the actual mc_id (fold identity)
    #   ENSEMBLE_SEED=<int> training.seed override (split RNG + init)
    # defaults below reproduce the original run exactly (offset 0, seed 42).
    env:
      FOLD_OFFSET: "0"
      ENSEMBLE_SEED: "42"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read ensemble parameters (committed trigger file overrides the defaults)
        run: |
          set -euo pipefail
          PARAMS=".github/triggers/ensemble-params"
          if [ -f "$PARAMS" ]; then
            echo "parameters from $PARAMS:"; grep -E '^[A-Z_]+=' "$PARAMS" || true
            grep -E '^(FOLD_OFFSET|ENSEMBLE_SEED)=[0-9]+$' "$PARAMS" >> "$GITHUB_ENV"
          else
            echo "no $PARAMS - using job defaults (FOLD_OFFSET=0, ENSEMBLE_SEED=42)"
          fi

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -r requirements.txt

      - name: Place competition data (sha256-pinned git bridge; Dropbox fallback)
        run: |
          set -euo pipefail
          mkdir -p data
          if [ -f data/bridge/manifest.json ]; then
            echo "data/bridge is in the tree - assembling locally (no network fetch, sha256-verified)"
            python scripts/assemble_data_bridge.py
          else
            echo "bridge absent - downloading the data-tab Dropbox mirrors"
            dl () {
              curl -fL --retry 3 --retry-delay 5 -o "data/$2" "$1" && echo "OK $2 $(stat -c%s data/$2) bytes" || { echo "FAILED $2"; exit 1; }
            }
            dl "https://www.dropbox.com/scl/fi/3vz9o0wwavi26xaeoxlwr/gems-geodawn-numerical-features.tif?rlkey=je8d8fepqfbst9lnwsq9rkplu&dl=1" training_features.tif
            dl "https://www.dropbox.com/scl/fi/t7fyt03qdh9egyme0itwo/existing_faults.tif?rlkey=yiao96uluqdkipf0h5vju71jf&dl=1" labels.tif
            dl "https://www.dropbox.com/scl/fi/6rgvnuady818ol8yqgis4/example_submission.tif?rlkey=kbykilvau066xuogoosbf4cq8&dl=1" sample_submission.tif
          fi
          ls -lh data/
          sha256sum data/*.tif | tee data/checksums.txt

      - name: Pre-flight data validation
        run: python scripts/prepare_data.py

      - name: Train fold ${{ matrix.fold }}
        run: |
          # Do not mask a failed trainer with a successful filtering subshell.
          # The previous pattern let a broken fold reach the blend job.
          set -euo pipefail
          python -m src.train --config configs/config_ci_ensemble.yaml \
            --override training.mc_id=${{ matrix.fold }} 2>&1 \
            | tr '\r' '\n' | tee train.log

      - name: Inference (raw, 8-way TTA) -> prob map
        run: |
          set -euo pipefail
          python -m src.inference --config configs/config_ci_ensemble.yaml --raw \
            --out outputs/prob_raw.tif 2>&1 \
            | tr '\r' '\n' | tee inference.log

      - name: Stage fold outputs
        run: |
          mkdir -p fold
          cp -f outputs/prob_raw.tif outputs/manifest.json outputs/heldout_mc$(( FOLD_OFFSET + ${{ matrix.fold }} )).npz fold/
          cp -f outputs/model_mc*.pt fold/ 2>/dev/null || true
          cp -f outputs/norm_stats.json fold/ 2>/dev/null || true
          cp -f train.log inference.log fold/ 2>/dev/null || true
          ls -la fold/

      - name: Upload fold artifact
        uses: actions/upload-artifact@v4
        with:
          name: fold-${{ matrix.fold }}
          path: fold/
          retention-days: 14

  blend:
    name: blend folds -> submission.tif
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: fold
    if: always()
    steps:
      - name: Refuse to blend incomplete fold set
        if: needs.fold.result != 'success'
        run: |
          echo "fold matrix result was ${{ needs.fold.result }}; no complete ensemble exists"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (numpy/rasterio/scipy/scikit-image only - no torch needed to blend)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy scipy rasterio scikit-image pyyaml

      - name: Download fold artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fold-*
          path: folds

      - name: Place labels + sample grid (sha256-pinned git bridge; Dropbox fallback)
        run: |
          set -euo pipefail
          mkdir -p data
          if [ -f data/bridge/manifest.json ]; then
            echo "data/bridge is in the tree - assembling locally (no network fetch, sha256-verified)"
            python scripts/assemble_data_bridge.py
          else
            echo "bridge absent - downloading the data-tab Dropbox mirrors"
            dl () { curl -fL --retry 3 -o "data/$2" "$1" && echo "OK $2 $(stat -c%s data/$2)"; }
            dl "https://www.dropbox.com/scl/fi/t7fyt03qdh9egyme0itwo/existing_faults.tif?rlkey=yiao96uluqdkipf0h5vju71jf&dl=1" labels.tif
            dl "https://www.dropbox.com/scl/fi/6rgvnuady818ol8yqgis4/example_submission.tif?rlkey=kbykilvau066xuogoosbf4cq8&dl=1" sample_submission.tif
            dl "https://www.dropbox.com/scl/fi/3vz9o0wwavi26xaeoxlwr/gems-geodawn-numerical-features.tif?rlkey=je8d8fepqfbst9lnwsq9rkplu&dl=1" training_features.tif
          fi

      - name: Blend + shape + write submission
        run: |
          set -uo pipefail
          python scripts/blend_submission.py \
            --folds folds/fold-*/ \
            --config configs/config_ci_ensemble.yaml \
            --sample data/sample_submission.tif \
            --labels data/labels.tif \
            --out submission.tif --report blend_report.json --weights equal 2>&1 | tee blend.log

      - name: Validate submission format (exit code gates the commit)
        run: |
          set -uo pipefail
          python scripts/validate_submission.py --pred submission.tif \
            --sample data/sample_submission.tif --train data/training_features.tif 2>&1 | tee validation.log

      - name: Commit run report + submission to the branch
        if: always()
        run: |
          set -uo pipefail
          D="data/evidence/runs/${{ github.run_id }}"
          mkdir -p "$D"
          cp -f blend_report.json "$D/" 2>/dev/null || true
          cp -f blend.log validation.log "$D/" 2>/dev/null || true
          # Only a real submission may be committed.  Run 35042805806 committed a 110-byte
          # GDAL stub left behind by the crashed writer, and every downstream reader treated
          # it as a submission.  Size + a read-back check are cheap and decisive.
          if [ -f submission.tif ] && [ "$(stat -c%s submission.tif)" -gt 10000 ] && \
             python -c "import rasterio,numpy as np,sys; s=rasterio.open('submission.tif'); a=s.read(1); sys.exit(0 if (s.count==1 and s.dtypes[0]=='float32' and np.count_nonzero(np.nan_to_num(a))>0) else 1)"; then
            cp -f submission.tif "$D/submission.tif"
            sha256sum submission.tif | tee "$D/submission.sha256"
          else
            echo "NO VALID submission.tif - committing the failure evidence instead"
            rm -f "$D/submission.tif" "$D/submission.sha256"
            printf '{"status":"NO_SUBMISSION","reason":"blend or validate step failed - see blend.log/validation.log in this directory","run_id":"%s"}\n' "${{ github.run_id }}" > "$D/FAILED.json"
          fi
          for f in folds/fold-*/manifest.json; do
            [ -f "$f" ] && cp -f "$f" "$D/$(basename "$(dirname "$f")").manifest.json" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$D" || true
          git diff --cached --quiet && echo "nothing to commit" || {
            git commit -m "train(ensemble): run report ${{ github.run_id }} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Upload final submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-final-${{ github.run_id }}
          path: |
            submission.tif
            blend_report.json
            blend.log
            validation.log
          retention-days: 30
